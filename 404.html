<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Space Grotesk',sans-serif;background:#0a0a0f;color:#e0e0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .container{padding:2rem}
    .code{font-family:'Orbitron',sans-serif;font-size:8rem;font-weight:900;background:linear-gradient(135deg,#00f5ff,#bf00ff,#ff0080);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
    .message{font-size:1.2rem;color:#6a6a8a;margin:1rem 0 2rem}
    .back{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 2rem;border-radius:10px;
      border:1px solid #00f5ff;color:#00f5ff;text-decoration:none;font-weight:600;transition:all .3s}
    .back:hover{background:rgba(0,245,255,0.1);box-shadow:0 0 20px rgba(0,245,255,0.2)}
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">This page has drifted into the void.</p>
    <a href="/" class="back">← Back to Home</a>
  </div>
</body>
</html>
